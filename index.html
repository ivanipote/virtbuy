<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtBuy - Pâtisserie</title>

    <style>
        body {
            background-color: rgb(207, 191, 172);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .header {
            padding: 10px 15px;
            text-align: center;
            flex-shrink: 0;
        }

        .desc {
            color: rgb(146, 14, 137);
            font-size: 26px;
            font-weight: bold;
            background-color: azure;
            border-radius: 15px;
            padding: 8px;
            margin: 0 0 5px 0;
        }

        .pro {
            color: rgb(202, 17, 174);
            font-size: 15px;
            font-weight: bold;
            margin: 0;
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 10px 15px;
            padding-bottom: 100px; /* Espace pour le bouton flottant */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        video, img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            display: block;
        }

        /* LE BOUTON FLOTTANT */
        .btn {
            background-color: #0B2545;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);

            /* 👇 LES LIGNES MAGIQUES 👇 */
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .btn:hover {
            background-color: #D4AF37;
            transform: scale(1.05);
            color: #0B2545;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .desc { font-size: 20px; }
            .pro { font-size: 13px; }

            /* Sur mobile, le bouton prend toute la largeur en bas */
            .btn {
                left: 20px;
                right: 20px;
                text-align: center;
                bottom: 20px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <p class="desc">Bienvenue sur VirtBuy</p>
        <p class="pro">Observez les produits pâtissiers, le pain croustillant !</p>
    </header>

    <main>
        <video src="gateau.mp4" controls muted></video>
        <img src="gat.png" alt="Image Non Disponible">

        <p style="text-align: center; color: #555; padding-bottom: 20px;">Découvrez nos délicieuses pâtisseries faites maison avec amour. Chaque bouchée est une explosion de saveurs !</p>
    </main>

    <!-- ON A SUPPRIMÉ LE FOOTER, LE BOUTON EST DANS LE MAIN MAIS FLOTTANT -->
    <a class="btn" href="https://pay.jeko.africa/pl/5c180956-5257-4645-8e5b-629b37c4af7b" target="_blank">
        Payer : 500 F
    </a>

</body>
</html>
