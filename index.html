<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtBuy - Pâtisserie</title>

    <style>
        /* 1. On bloque le scroll de la page et on fait une colonne */
        body {
            background-color: rgb(199, 234, 217);
            margin: 0;
            padding: 10px 15px;
            height: 100vh; /* Prend toute la hauteur de l'écran */
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            overflow: hidden; /* Empêche de scroller */
        }

        /* 2. Les textes en haut */
        .desc {
            color: rgb(146, 14, 137);
            font-size: 26px;
            text-align: center;
            font-weight: bold;
            background-color: azure;
            border-radius: 15px;
            padding: 8px;
            margin: 0 0 5px 0;
        }

        .pro {
            color: rgb(202, 17, 174);
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            margin: 0 0 10px 0;
        }

        /* 3. La zone des médias (Vidéo et Image) */
        .medias {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1; /* Prend tout l'espace restant entre les textes et le bouton */
            min-height: 0; /* Bug fix pour que ça rétrécisse bien */
        }

        video, img {
            width: 100%;
            flex: 1; /* La vidéo et l'image se partagent l'espace restant à 50/50 */
            object-fit: cover; /* Remplit l'espace sans déformer */
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            min-height: 0;
        }

        /* 4. LE BOUTON EN BAS A DROITE */
        .btn {
            background-color: #0B2545;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);

            /* On le pousse à droite avec Flexbox */
            align-self: flex-end; /* Le colle à droite */
            margin-top: 10px;
            display: inline-block;
        }

        .btn:hover {
            background-color: #D4AF37;
            transform: scale(1.05);
            color: #0B2545;
        }
    </style>
</head>
<body>

    <p class="desc">Bienvenue sur VirtBuy</p>
    <p class="pro">Observez les produits pâtissiers, le pain croustillant !</p>

    <!-- La zone qui prend l'espace restant -->
    <div class="medias">
        <video src="gateau.mp4" controls muted></video>
        <img src="gat.png" alt="Image Non Disponible">
    </div>

    <!-- Le bouton est poussé à droite en bas -->
    <a class="btn" href="https://pay.jeko.africa/pl/5c180956-5257-4645-8e5b-629b37c4af7b" target="_blank">
        Payer : 500 F unité
    </a>

</body>
</html>
