<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtBuy - Version Bootstrap</title>

    <!-- 👇 C'EST LA LIGNE MAGIQUE : On télécharge Bootstrap depuis internet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- 1. LA BARRE DE NAVIGATION (Header) -->
    <!-- La classe "navbar" fait tout le travail. "navbar-dark" met le texte en blanc. -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="#">VirtBuy</a>

        <!-- La barre de recherche -->
        <form class="d-flex w-50">
            <input class="form-control me-2" type="search" placeholder="Taper pour rechercher" aria-label="Search">
            <button class="btn btn-outline-light" type="submit">Chercher</button>
        </form>

        <button class="btn btn-warning ms-3">Paramètres</button>
    </nav>

    <!-- 2. LA GRILLE DE PRODUITS -->
    <!-- "container" centre le contenu. "mt-4" ajoute une marge en haut. -->
    <div class="container mt-4">

        <!-- "row" crée une ligne. "g-4" gère l'espace entre les cartes. -->
        <div class="row g-4">

            <!-- PREMIÈRE CARTE -->
            <!-- "col-md-6" veut dire : prend la moitié de l'écran sur PC (2 cartes par ligne) -->
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/400/300" class="card-img-top" alt="Produit">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Sac à dos</h5>
                        <p class="card-text text-success fw-bold fs-4">3000 F</p>
                        <!-- "d-grid" met le bouton en pleine largeur -->
                        <div class="d-grid gap-2">
                            <a href="https://wa.me/2250503588336/" class="btn btn-primary">Acheter sur WhatsApp</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DEUXIÈME CARTE -->
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/401/300" class="card-img-top" alt="Produit">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Montre connectée</h5>
                        <p class="card-text text-success fw-bold fs-4">5000 F</p>
                        <div class="d-grid gap-2">
                            <a href="https://wa.me/2250503588336/" class="btn btn-primary">Acheter sur WhatsApp</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TROISIÈME CARTE -->
            <div class="col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/402/300" class="card-img-top" alt="Produit">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Casque Audio</h5>
                        <p class="card-text text-success fw-bold fs-4">8000 F</p>
                        <div class="d-grid gap-2">
                            <a href="https://wa.me/2250503588336/" class="btn btn-primary">Acheter sur WhatsApp</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script JavaScript de Bootstrap (pour les menus mobiles) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
